# Which base image the hub builds this add-on on, per architecture. A Pi is
# aarch64 (a 4 or 5, 64-bit) or armv7; the rest are here so Home Assistant
# on a NUC or an old laptop can install the same add-on.
#
# Alpine 3.19 carries Node 20, and the relay needs 18 or newer for fetch.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.19
  armv7: ghcr.io/home-assistant/armv7-base:3.19
  armhf: ghcr.io/home-assistant/armhf-base:3.19
  amd64: ghcr.io/home-assistant/amd64-base:3.19
  i386: ghcr.io/home-assistant/i386-base:3.19
